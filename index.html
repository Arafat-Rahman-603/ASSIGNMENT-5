<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 font-sans">
    <div
      id="loginPage"
      class="h-screen flex items-center justify-center bg-gray-100"
    >
      <div class="bg-white w-[360px] p-8 rounded-lg shadow">
        <div class="flex flex-col items-center gap-0">
          <img src="./assets/github-logo.png" alt="" class="h-12 mb-2" />
          <h2 class="text-xl font-bold text-center">GitHub Issues Tracker</h2>
          <p class="text-gray-600 mb-4">Sign in to manage your issues</p>
        </div>
        <label
          for="username"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Username
        </label>
        <input
          id="username"
          placeholder="Enter Username"
          class="border w-full p-2 rounded"
        />
        <p class="text-sm text-[#4A00FF] mb-4">Default: admin</p>
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Password
        </label>
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          class="border w-full p-2 rounded"
        />
        <p class="text-sm text-[#4A00FF] mb-4">Default: admin123</p>
        <button
          onclick="login()"
          class="w-full bg-purple-600 text-white py-2 rounded"
        >
          Sign In
        </button>
        <div class="flex items-center my-3">
          <div class="flex-1 h-px bg-gray-300"></div>
          <span class="px-3 text-sm text-gray-500">OR</span>
          <div class="flex-1 h-px bg-gray-300"></div>
        </div>
        <p class="my-2 text-gray-500 text-center">Demo Credentials:</p>
        <ul class="text-gray-700">
          <li class="text-center"><strong>Username:</strong> admin</li>
          <li class="text-center"><strong>Password:</strong> admin123</li>
        </ul>
      </div>
    </div>

    <div id="dashboard" class="hidden max-w-7xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold flex gap-2 items-center">
          <img src="./assets/github-logo.png" class="h-6" />
          GitHub Issues Tracker
        </h1>

        <div class="flex gap-3">
          <input
            id="search"
            placeholder="Search issues..."
            class="border p-2 rounded w-64"
          />

          <button
            onclick="addIssue()"
            class="bg-purple-600 text-white px-4 py-2 rounded"
          >
            + New Issue
          </button>
        </div>
      </div>

      <div class="flex gap-3 mb-4 mt-20 bg-white p-4 rounded shadow">
        <button
          onclick="filterStatus('', this)"
          class="tab bg-purple-600 text-white px-4 py-2 rounded"
        >
          All
        </button>

        <button
          onclick="filterStatus('open', this)"
          class="tab border px-4 py-2 rounded"
        >
          Open
        </button>

        <button
          onclick="filterStatus('closed', this)"
          class="tab border px-4 py-2 rounded"
        >
          Closed
        </button>
      </div>

      <div class="flex justify-between mb-2 bg-white p-4 rounded shadow">
        <div class="flex items-center gap-2">
          <img src="./assets/Aperture.png" alt="" />
          <div>
            <h3 class="font-bold">0 Issues</h3>
            <p class="text-sm text-gray-500">
              Track and manage your project issues
            </p>
          </div>
        </div>

        <div class="flex gap-6">
          <div class="flex items-center gap-1">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <p class="text-sm">Open</p>
          </div>

          <div class="flex items-center gap-1">
            <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
            <p class="text-sm">Closed</p>
          </div>
        </div>
      </div>

      <div
        id="issues"
        class="grid sm:grid-cols-3 grid-cols-2 md:grid-cols-4 gap-4 bg-white/80 p-4 rounded"
      ></div>
    </div>

    <div
      id="modal"
      class="hidden fixed inset-0 bg-[rgba(74,0,255,0.2)] flex items-center justify-center"
    >
      <div class="bg-white w-[500px] rounded-xl shadow-xl p-6">
        <h2 class="text-lg font-bold mb-3"></h2>

        <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
          <span class="bg-green-500 text-white text-xs px-3 py-1 rounded-full"
            >Opened</span
          >
          <span id="modalUser"></span>
          <span>•</span>
          <span id="modalDate"></span>
        </div>

        <div class="flex gap-2 mb-4">
          <span
            class="bg-red-100 text-red-500 text-xs font-semibold px-3 py-1 rounded-full"
          >
            BUG
          </span>

          <span
            class="bg-yellow-100 text-yellow-600 text-xs font-semibold px-3 py-1 rounded-full"
          >
            HELP WANTED
          </span>
        </div>

        <p class="text-gray-600 mb-6"></p>

        <div class="flex justify-between mb-6">
          <div>
            <p class="text-sm text-gray-400">Assignee</p>
            <p id="modalAssignee" class="font-semibold"></p>
          </div>

          <div>
            <p class="text-sm text-gray-400">Priority</p>
            <span
              id="modalPriority"
              class="text-xs px-3 py-1 rounded-full"
            ></span>
          </div>
        </div>

        <div class="flex justify-end">
          <button
            onclick="document.getElementById('modal').classList.add('hidden')"
            class="bg-purple-600 text-white px-6 py-2 rounded"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
